name: Tests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: POSIX sh / Bats
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
          mkdir -p "$RUNNER_TEMP/glow-bin"
          GOBIN="$RUNNER_TEMP/glow-bin" go install charm.land/glow/v3@v3.0.0
          echo "$RUNNER_TEMP/glow-bin" >> "$GITHUB_PATH"

      - name: Install emdee-eyes
        run: ./install.sh

      - name: Run release-hook tests
        run: ./tests/hooks.sh

      - name: Validate pushed release tag
        if: github.ref_type == 'tag'
        run: |
          tag_oid=$(git rev-parse "$GITHUB_REF")
          ./.githooks/check-release-tag "$GITHUB_REF" "$tag_oid" '' origin

      - name: Run POSIX test suite
        run: ./tests/run.sh

  powershell:
    name: PowerShell / Pester
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Install Glow
        shell: pwsh
        run: |
          $glowBin = Join-Path $env:RUNNER_TEMP 'glow-bin'
          New-Item -ItemType Directory -Force -Path $glowBin | Out-Null
          $env:GOBIN = $glowBin
          go install charm.land/glow/v3@v3.0.0
          $glowBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install emdee-eyes
        shell: pwsh
        run: ./install.ps1

      - name: Run PowerShell test suite
        shell: pwsh
        run: ./tests/run.ps1
